  # FastAPI Application (Development with hot-reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: soat_api_dev
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: ${APP_NAME:-Insurance Intermediary Backend}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Multi-tenant insurance policy intermediary platform}
      APP_VERSION: ${APP_VERSION:-1.0.0-dev}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DB_ECHO: ${DB_ECHO:-true}
      
      # AWS Configuration
      USE_SECRETS_MANAGER: ${USE_SECRETS_MANAGER:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_STAGE: ${AWS_STAGE:-dev}
      USE_COGNITO: ${USE_COGNITO:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      
      # # Database
      # DB_HOST: ${DB_HOST:-mysql}
      # DB_PORT: ${DB_PORT:-3306}
      # DB_USER: ${DB_USER:-soat_user}
      # DB_PASSWORD: ${DB_PASSWORD:-soat_password}
      # DB_NAME: ${DB_NAME:-soat_db}
      
      # AWS Credentials (if needed)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app  # Hot-reload
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./tests:/app/tests  # Mount tests directory
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    networks:
      - soat_network_dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  # # phpMyAdmin (for database management)
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: soat_phpmyadmin_dev
