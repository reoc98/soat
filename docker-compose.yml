version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: soat_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-soat_db}
      MYSQL_USER: ${MYSQL_USER:-soat_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-soat_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db:/docker-entrypoint-initdb.d
    networks:
      - soat_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soat_api
    restart: unless-stopped
    environment:
      # Application
      APP_NAME: ${APP_NAME:-Insurance Intermediary Backend}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-Multi-tenant insurance policy intermediary platform}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_ECHO: ${DB_ECHO:-false}
      
      # AWS Configuration
      USE_SECRETS_MANAGER: ${USE_SECRETS_MANAGER:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_STAGE: ${AWS_STAGE:-dev}
      USE_COGNITO: ${USE_COGNITO:-false}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}
      
      # Database (will be loaded from AWS Secrets Manager if USE_SECRETS_MANAGER=true)
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-soat_user}
      DB_PASSWORD: ${DB_PASSWORD:-soat_password}
      DB_NAME: ${DB_NAME:-soat_db}
      
      # AWS Credentials (if needed)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app  # Mount for development hot-reload
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soat_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # phpMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: soat_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-soat_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-soat_password}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - soat_network
    profiles:
      - debug  # Only starts when using --profile debug

networks:
  soat_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
